name: Sync upstream

on:
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: Upstream commit detected by Cloudflare
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'chnnic/jiwo-probe'
    runs-on: ubuntu-latest
    steps:
      - name: Check out user repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream updates
        env:
          UPSTREAM_REPOSITORY: chnnic/jiwo-probe
          UPSTREAM_BRANCH: main
          REQUESTED_UPSTREAM_SHA: ${{ inputs.upstream_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

          UPSTREAM_SHA="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
          if [[ -n "${REQUESTED_UPSTREAM_SHA}" && "${REQUESTED_UPSTREAM_SHA}" != "${UPSTREAM_SHA}" ]]; then
            echo "Upstream advanced again; syncing ${UPSTREAM_SHA}."
          fi

          git diff --binary HEAD "upstream/${UPSTREAM_BRANCH}" -- . \
            ':(exclude).github/workflows/**' \
            ':(exclude).upstream-sha' \
            ':(exclude)src/license-badges.ts' | git apply --index

          printf '%s\n' "${UPSTREAM_SHA}" > .upstream-sha
          git add .upstream-sha

          if git diff --cached --quiet; then
            echo "Already up to date."
            exit 0
          fi

          git commit -m "chore: sync upstream ${UPSTREAM_REPOSITORY}@$(git rev-parse --short "${UPSTREAM_SHA}")"
          git push origin "HEAD:${GITHUB_REF_NAME}"
