name: Sync upstream

on:
  schedule:
    # 每小时第 23 分钟检查更新，避开整点的 Actions 高峰。
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    # 官方仓库自身不跑；fork 仓库跑。upstream 指向定制源(chnnic/jiwo-probe)。
    if: github.repository != 'chnnic/jiwo-probe'
    runs-on: ubuntu-latest
    steps:
      - name: Check out user repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream updates
        env:
          UPSTREAM_REPOSITORY: chnnic/jiwo-probe
          UPSTREAM_BRANCH: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

          if git diff --quiet HEAD "upstream/${UPSTREAM_BRANCH}"; then
            echo "Already up to date."
            exit 0
          fi

          git merge --no-edit "upstream/${UPSTREAM_BRANCH}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
